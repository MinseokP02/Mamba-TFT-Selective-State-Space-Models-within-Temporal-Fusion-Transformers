run:
  name: "simple_mamba_all"
  seed: 42
  artifacts_dir: "artifacts"
  reports_dir: "reports"

data:
  csv_path: "datasets/filtered_first.csv"
  index_is_time: true
  daily_grid:
    start_hour: 7
    end_hour: 17
  real_cols: ["rn", "hm", "ss", "icsr", "pv_output", "pv_v", "pv_i", "pf"]
  missing_flag_cols: ["pv_v", "pv_i", "pf", "pv_output"]
  fillna_value: 0.0
  group_id_value: "site0"
  group_col: "series_id"
  time_idx_col: "time_idx"
  allow_missing_time_idx: false

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

model:
  encoder_length: 77
  prediction_length: 11
  d_model: 64
  num_mamba_layers: 2
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1

train:
  batch_size: 64
  num_workers: 0
  lr: 0.001
  weight_decay: 0.00001
  quantiles: [0.1, 0.5, 0.9]
  max_epochs: 100
  early_stop_patience: 15
  accelerator: "auto"
  devices: 1
  log_every_n_steps: 10
  deterministic: "warn"

features:
  target: "pv_output"
  known_reals: ["hour", "dayofweek", "month", "rn", "hm", "ss", "icsr"]
  future_available_reals: ["rn", "hm", "ss", "icsr"]
  unknown_reals: ["pv_output", "pv_v", "pv_i", "pf"]

eval:
  hours_from: 7
  hours_to: 17
