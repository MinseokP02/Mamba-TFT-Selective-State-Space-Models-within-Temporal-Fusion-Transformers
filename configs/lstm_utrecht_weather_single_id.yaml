run:
  name: "lstm_all"
  seed: 42
  artifacts_dir: "artifacts"
  reports_dir: "reports"

data:
  csv_path: "datasets/tft_utrecht_ID003_weather_07_17.csv"
  index_is_time: false
  daily_grid:
    start_hour: 7
    end_hour: 17
  real_cols: [
    "temperature_2m",
    "relative_humidity_2m",
    "precipitation",
    "rain",
    "cloud_cover",
    "shortwave_radiation",
    "direct_radiation",
    "diffuse_radiation",
    "direct_normal_irradiance",
    "sunshine_duration",
    "wind_speed_10m",
    "pv_output"]
  missing_flag_cols: ["pv_output"]
  fillna_value: 0.0
  group_id_value: "site0"

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

lstm:
  window_size: 77
  batch_size: 64
  max_epochs: 100
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
  horizon : 11
  learning_rate: 0.01

features:
  target: "pv_output"
  input_reals: ["temperature_2m","relative_humidity_2m","precipitation","rain","cloud_cover","shortwave_radiation","direct_radiation","diffuse_radiation","direct_normal_irradiance","sunshine_duration","wind_speed_10m"]

eval:
  hours_from: 7
  hours_to: 17
