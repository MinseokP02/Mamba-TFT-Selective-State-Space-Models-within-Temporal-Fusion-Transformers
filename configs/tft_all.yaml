run:
  name: "tft_all"
  seed: 42
  artifacts_dir: "artifacts"
  reports_dir: "reports"

data:
  csv_path: datasets/filtered_first.csv
  index_is_time: true
  daily_grid:
    start_hour: 7
    end_hour: 17   # inclusive
  real_cols: ["rn","hm","ss","icsr","pv_output","pv_v","pv_i","pf"]
  missing_flag_cols: ["pv_v","pv_i","pf","pv_output"]
  fillna_value: 0.0
  group_id_value: "site0"

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

tft:
  max_encoder_length: 77
  max_prediction_length: 11
  batch_size: 32
  max_epochs: 200
  hidden_size: 32
  lstm_layers: 4
  dropout: 0.6
  attention_head_size: 2
  learning_rate: 0.001
  quantiles: [0.1, 0.5, 0.9]

features:
  target: "pv_output"
  group_ids: ["series_id"]
  known_reals: ["hour","dayofweek","month","rn","hm","ss","icsr"]
  future_available_reals: ["rn","hm","ss","icsr"]
  unknown_reals: ["pv_output","pv_v","pv_i","pf"]

eval:
  hours_from: 7
  hours_to: 17
