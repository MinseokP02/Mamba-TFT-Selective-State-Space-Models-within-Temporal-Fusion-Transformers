run:
  name: "lstm_all"
  seed: 42
  artifacts_dir: "artifacts"
  reports_dir: "reports"

data:
  csv_path: "datasets/filtered_first.csv"
  index_is_time: true
  daily_grid:
    start_hour: 7
    end_hour: 17
  real_cols: ["rn","hm","ss","icsr","pv_output","pv_v","pv_i","pf"]
  missing_flag_cols: ["pv_v","pv_i","pf","pv_output"]
  fillna_value: 0.0
  group_id_value: "site0"

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

lstm:
  window_size: 77
  batch_size: 64
  max_epochs: 50
  hidden_size: 64
  num_layers: 2
  dropout: 0.1
  horizon: 11
  learning_rate: 0.002

features:
  target: "pv_output"
  input_reals: ["hour","dayofweek","month","rn","hm","ss","icsr","pv_v","pv_i","pf","pv_output"]
  known_future_reals: ["hour","dayofweek","month","rn","hm","ss","icsr"]

eval:
  hours_from: 7
  hours_to: 17
