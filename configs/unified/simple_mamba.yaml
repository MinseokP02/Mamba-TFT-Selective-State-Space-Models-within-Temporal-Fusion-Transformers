# Unified hyperparameters for fair 5-model comparison (see report1.md)
run:
  name: simple_mamba_utrecht_weather_single_id
  seed: 42
  artifacts_dir: artifacts
  reports_dir: reports
data:
  csv_path: datasets/tft_utrecht_ID003_weather_07_17.csv
  index_is_time: false
  daily_grid:
    start_hour: 7
    end_hour: 17
  real_cols:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  - pv_output
  missing_flag_cols:
  - pv_output
  fillna_value: 0.0
  group_id_value: site0
  group_col: series_id
  time_idx_col: time_idx
  allow_missing_time_idx: false
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
model:
  encoder_length: 77
  prediction_length: 11
  d_model: 64
  num_mamba_layers: 1
  d_state: 16
  d_conv: 2
  expand: 2
  dropout: 0.4
train:
  batch_size: 64
  num_workers: 0
  lr: 0.001
  weight_decay: 1.0e-05
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  max_epochs: 100
  early_stop_patience: 10
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  deterministic: warn
  gradient_clip_val: 0.1
features:
  target: pv_output
  known_reals:
  - time_idx
  - hour
  - dayofweek
  - month
  - dayofyear
  - year
  - is_daylight
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  future_available_reals:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  unknown_reals:
  - pv_output
eval:
  hours_from: 7
  hours_to: 17
