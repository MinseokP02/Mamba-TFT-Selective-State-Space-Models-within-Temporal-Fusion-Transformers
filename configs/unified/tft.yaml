# Unified hyperparameters for fair 5-model comparison (see report1.md)
run:
  name: tft_utrecht_weather_single_id
  seed: 42
  artifacts_dir: artifacts
  reports_dir: reports
data:
  csv_path: datasets/tft_utrecht_ID003_weather_07_17.csv
  index_is_time: false
  daily_grid:
    start_hour: 7
    end_hour: 17
  real_cols:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  - pv_output
  missing_flag_cols: []
  fillna_value: 0.0
  group_id_value: site0
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
tft:
  max_encoder_length: 77
  max_prediction_length: 11
  batch_size: 64
  max_epochs: 100
  hidden_size: 64
  lstm_layers: 1
  dropout: 0.4
  attention_head_size: 1
  learning_rate: 0.001
  quantiles:
  - 0.1
  - 0.5
  - 0.9
  early_stop_patience: 10
  gradient_clip_val: 0.1
features:
  target: pv_output
  group_ids:
  - series_id
  known_reals:
  - time_idx
  - hour
  - dayofweek
  - month
  - dayofyear
  - year
  - is_daylight
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  future_available_reals:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - rain
  - cloud_cover
  - shortwave_radiation
  - direct_radiation
  - diffuse_radiation
  - direct_normal_irradiance
  - sunshine_duration
  - wind_speed_10m
  unknown_reals:
  - pv_output
eval:
  hours_from: 7
  hours_to: 17
